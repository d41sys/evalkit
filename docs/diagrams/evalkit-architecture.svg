<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 960 448" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="evalkit-architecture-title evalkit-architecture-desc" id="evalkit-architecture-root">
<title id="evalkit-architecture-title">evalkit architecture</title>
<desc id="evalkit-architecture-desc">A YAML task spec and dataset are loaded and validated, then the threaded eval runner queries model adapters and fans out to sandboxed code execution, classical metrics and calibration, which write results.jsonl; the aggregator adds bootstrap confidence intervals and Elo ratings to produce leaderboard.md.</desc>
<defs>
      <style>#evalkit-architecture-root { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; color: #1f2328; }
      #evalkit-architecture-root .diagram-container { width: 100%; overflow-x: auto; }
      @media print {
#evalkit-architecture-root .diagram-container { overflow-x: visible; }
}</style>
